dataset:
    name: adult
    url: https://archive.ics.uci.edu/static/public/2/adult.zip
vae:
    epochs: 1000
    learning_rate: 0.001
    batch_size: 256
    dropout: 0.0
    activation: LeakyReLU
    layernorm: true
    latent:
        mode: custom
        heuristic: null
        latent_dim: 256
        encoder_dims:
        - 2048
        - 1024
        - 512
        decoder_dims:
        - 512
        - 1024
        - 2048
    mmd:
        mode: constant
        weight: 500.0
diffusion:
    epochs: 2000
    learning_rate: 0.001
    num_diffusion_steps: 2000
    context_injection:
        context_columns:
        - State-gov
    architecture:
        type: standard
        hidden_dims:
        - 512
        - 512
        - 256
        dropout: 0.1
    time_conditioning:
        embedding: sinusoidal
        method: film
        embedding_dim: 128
    noise_schedule:
        type: linear
        beta_start: 0.0001
        beta_end: 0.02
