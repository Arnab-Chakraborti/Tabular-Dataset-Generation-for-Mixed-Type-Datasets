vae_training:
  MMD Weight: 250.0
  VAE epochs: 250
  batch_size: 256
  latent_dim: 64
  dropout: 0.1
  lr: 0.0008
architecture:
  Encoder_dims:
  - 512
  - 256
  - 128
  Decoder_dims:
  - 128
  - 256
  - 512
  hidden_dims:
  - 512
  - 256
  diffusion_hidden_dims:
  - 512
  - 256
  time_embedding_dim: 128
  activation: SiLU
  use_layernorm: true
diffusion:
  prediction_type: noise
  num_diffusion_steps: 100
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear
  diffusion_epochs: 200
  diffusion_lr: 0.00075
